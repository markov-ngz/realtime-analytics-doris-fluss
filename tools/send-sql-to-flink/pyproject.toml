[project]
name = "send-sql-to-flink"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "markov-ngz" }
]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
send-sql-to-flink = "send_sql_to_flink:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]

[tool.ruff]
src = ["src"]