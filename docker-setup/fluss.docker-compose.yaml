services:
  zookeeper:
    container_name: zookeeper-1
    image: zookeeper@sha256:d0ae1665a1e85022261dc05a10e030c83895060401cd5c1bf990ed6b4d38c31b # 3.9.6
    ports:
      - "127.0.0.1:2181:2181"
      - "127.0.0.1:2888:2888"
      - "127.0.0.1:3888:3888"
    environment:
      ZOO_MY_ID: "1"
      ZOO_PORT: "2181"
      ZOO_STANDALONE_ENABLED: "true"
      ZOO_SERVERS: "server.1=zookeeper:2888:3888;2181"
      ZOO_4LW_COMMANDS_WHITELIST: "mntr,conf,ruok"
    volumes:
      - zk-data:/data
      - zk-datalog:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s

    networks:
      quickstart-fluss-doris:

  fluss-coordinator:
    container_name: fluss-coordinator-1
    image: apache/fluss@sha256:ff461b45438033da4fd1c2556d3f978f3603bb3632fe075c2bd57388339a58cb # 1.0.0
    command: coordinatorServer
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:9123:9123"
    environment:
      FLUSS_PROPERTIES: |
        
        bind.listeners: FLUSS://fluss-coordinator:9123
        
        default.bucket.number: 1
        default.replication.factor: 1
  
        zookeeper.path.root: /fluss
        zookeeper.address: zookeeper:2181
  
        data.dir: /tmp/fluss/data
  
        # diminishing size to trigger remote upload easily (default is 1024m)
        log.segment.file-size: 1m
        log.retention.roll-active-segment.enabled: true
  
        remote.data.dir: s3://fluss/remote-data
        s3.endpoint: http://rustfs:9000
        s3.access-key: rustfsadmin
        s3.secret-key: rustfsadmin
        s3.region: eu-north-1
        s3.path-style-access: true
        s3.assumed.role.arn: arn:aws:iam::000000000000:role/rustfsadmin
        s3.assumed.role.sts.endpoint: http://rustfs:9000
        
        datalake.enabled: true
        datalake.format: paimon
        datalake.paimon.metastore: filesystem
        datalake.paimon.warehouse: s3://datalake/paimon
        datalake.paimon.s3.endpoint: http://rustfs:9000
        datalake.paimon.s3.access-key: rustfsadmin
        datalake.paimon.s3.secret-key: rustfsadmin
        datalake.paimon.s3.path.style.access: true
    volumes:
      - ./fluss_plugins/paimon/paimon-s3-2.0.0.jar:/opt/fluss/plugins/paimon/paimon-s3-2.0.0.jar:ro

    networks:
      quickstart-fluss-doris:

  fluss-tablet:
    container_name: fluss-tablet-1
    image: apache/fluss@sha256:ff461b45438033da4fd1c2556d3f978f3603bb3632fe075c2bd57388339a58cb # 1.0.0
    command: tabletServer
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "bind.listeners: FLUSS://fluss-tablet:9123" >> /opt/fluss/conf/server.yaml
        exec /docker-entrypoint.sh tabletServer
    depends_on:
      zookeeper:
        condition: service_healthy
      fluss-coordinator:
        condition: service_started
    ports:
      - "127.0.0.1:9124:9124"
    environment:
      FLUSS_PROPERTIES: |
        
        tablet-server.id: 1
        bind.listeners: FLUSS://fluss-tablet:9123
        
        default.bucket.number: 1
        default.replication.factor: 1
  
        zookeeper.path.root: /fluss
        zookeeper.address: zookeeper:2181
  
        data.dir: /tmp/fluss/data
  
        # diminishing size to trigger remote upload easily (default is 1024m)
        log.segment.file-size: 1m
        log.retention.roll-active-segment.enabled: true
  
        remote.data.dir: s3://fluss/remote-data
        s3.endpoint: http://rustfs:9000
        s3.access-key: rustfsadmin
        s3.secret-key: rustfsadmin
        s3.region: eu-north-1
        s3.path-style-access: true
        s3.assumed.role.arn: arn:aws:iam::000000000000:role/rustfsadmin
        s3.assumed.role.sts.endpoint: http://rustfs:9000
        
        datalake.enabled: true
        datalake.format: paimon
        datalake.paimon.metastore: filesystem
        datalake.paimon.warehouse: s3://datalake/paimon
        datalake.paimon.s3.endpoint: http://rustfs:9000
        datalake.paimon.s3.access-key: rustfsadmin
        datalake.paimon.s3.secret-key: rustfsadmin
        datalake.paimon.s3.path.style.access: true
    volumes:
      - ./fluss_plugins/paimon/paimon-s3-2.0.0.jar:/opt/fluss/plugins/paimon/paimon-s3-2.0.0.jar:ro
      - fluss-data:/tmp/fluss/data
    networks:
      quickstart-fluss-doris:

  fluss-gateway:
    container_name: fluss-gateway-1
    image: apache/fluss-gateway@sha256:ce67d7faf82f866a2c59e58a9ebffdc108caa1077be24f5fcd94b3c61b17ce86 # 1.0.0
    depends_on:
      fluss-coordinator:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9095:9095"
    environment:
      FLUSS_GATEWAY__CLUSTERS: "default"
      FLUSS_GATEWAY__CLUSTER__DEFAULT__BOOTSTRAP__SERVERS: "fluss-coordinator:9123"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 35s

    networks:
      quickstart-fluss-doris:

volumes:
  zk-data:
  zk-datalog:
  fluss-data:


networks:
  quickstart-fluss-doris:
    name: quickstart-fluss-doris
    external: true