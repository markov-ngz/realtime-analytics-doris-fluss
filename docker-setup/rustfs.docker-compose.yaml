services:

  # permissions helper : https://docs.rustfs.com/en/installation/container/docker#docker-compose
  rustfs_perms:
    image: alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a # 3.24.3
    user: root
    volumes:
      - ./rustfs-data:/fix_path
    command: chown -R 10001:10001 /fix_path
    networks:
      quickstart-fluss-doris:

  rustfs:
    container_name: rustfs-1
    image: rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2 # 1.0.4
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    user: "10001:10001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      # ConfigMap settings
      RUSTFS_VOLUMES: "/data/rustfs0"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_OBS_LOGGER_LEVEL: "info"
      RUSTFS_OBJECT_CACHE_ENABLE: "true"
      RUSTFS_OBJECT_CACHE_TTL_SECS: "300"
      # Secret credentials
      RUSTFS_ACCESS_KEY: "rustfsadmin"
      RUSTFS_SECRET_KEY: "rustfsadmin"
    volumes:
      - ./rustfs-data:/data/rustfs0
      - rustfs-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      quickstart-fluss-doris:

  bucket-setup:
    image: amazon/aws-cli@sha256:6014c77975a4ae237395924cc821333f20bf87c91964a45dd4ed5f3b13b424f5 # 2.39.0
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: "rustfsadmin"
      AWS_SECRET_ACCESS_KEY: "rustfsadmin"
      AWS_ENDPOINT_URL: "http://rustfs:9000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        BUCKETS="flink-jobs flink-remote-storage fluss datalake"

        for BUCKET in $$BUCKETS; do
          if ! aws s3 ls "s3://$${BUCKET}" >/dev/null 2>&1; then
            echo "Bucket $${BUCKET} does not exist. Creating bucket..."
            aws s3 mb "s3://$${BUCKET}"
          else
            echo "Bucket $${BUCKET} already exists. Skipping creation."
          fi
        done

        echo "--- Listing all buckets ---"
        aws s3 ls
        echo "Buckets setup complete."
    networks:
      quickstart-fluss-doris:

volumes:
  rustfs-logs:

networks:
  quickstart-fluss-doris:
    name: quickstart-fluss-doris
    external: true